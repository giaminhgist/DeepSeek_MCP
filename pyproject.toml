[project]
name = "deepseek-mcp"
version = "0.1.0"
description = "DeepSeek Worker MCP server for Claude Code: read-only, read-heavy repository delegation to DeepSeek V4 Pro"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gia Minh Hoang" }]
keywords = ["mcp", "deepseek", "claude-code", "anthropic", "worker"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "anthropic>=0.40.0,<1",
    "mcp>=1.9.0,<2",
    "pathspec>=0.12.0",
    "pyyaml>=6.0.2",
]

[project.scripts]
deepseek-mcp = "deepseek_mcp.__main__:main"

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "ruff>=0.8,<1",
    "types-PyYAML>=6.0.12",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepseek_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "C4", "S"]
ignore = ["S603", "S607"] # fixed-argv subprocess usage is intentional and validated

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = [
    "error",
    # Raised at import time by pydantic-settings internals inside the MCP SDK.
    "ignore:Field 'lifespan' has an incomplete definition:UserWarning",
]
